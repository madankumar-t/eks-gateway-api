apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: ${APP_NAME}-tgconfig
  namespace: ${NAMESPACE}
spec:
  targetReference:
    group: ""
    kind: Service
    name: ${APP_NAME}
  protocol: HTTP
  port: 80
  healthCheck:
    enabled: true
    path: /
    port: traffic-port
    protocol: HTTP
    intervalSeconds: 15
    timeoutSeconds: 5
    healthyThresholdCount: 2
    unhealthyThresholdCount: 2
    matcher:
      httpCode: "200-399"
