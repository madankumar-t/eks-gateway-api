apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP_NAME}-route
  namespace: ${NAMESPACE}
spec:
  hostnames:
  - ${APP_FQDN}
  parentRefs:
  - name: ${APP_NAME}-gateway
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: ${APP_NAME}
      port: 80
      weight: 1
